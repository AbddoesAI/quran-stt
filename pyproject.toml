[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quran-stt"
version = "0.2.0"
description = "AI-powered Islamic lecture transcription with Quran & Hadith detection"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["whisper", "transcription", "quran", "hadith", "islamic", "stt", "urdu", "arabic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "faster-whisper>=1.1.0",
    "langdetect>=1.0.9",
    "lingua-language-detector>=2.0.2",
    "rapidfuzz>=3.9.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "colorama>=0.4.6",
    # Fix 1: thread-safe persistent cache (replaces shelve)
    "diskcache>=5.6.0",
    # Fix 8: fast JSON serialization
    "orjson>=3.9.0",
    # Fix 9: async HTTP for Hadith matching
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",      # Fix 12: coverage reporting
    "pip-audit>=2.7.0",     # Fix 12: dependency security scanning
    "ruff>=0.4.0",
]
perf = [
    # Fix 6: Aho-Corasick multi-pattern formula matching
    "pyahocorasick>=2.0.0",
]

[project.scripts]
quran-stt = "islamic_stt.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/quran-stt"
Documentation = "https://github.com/yourusername/quran-stt/blob/main/docs/context.md"
Issues = "https://github.com/yourusername/quran-stt/issues"
Changelog = "https://github.com/yourusername/quran-stt/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["islamic_stt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
